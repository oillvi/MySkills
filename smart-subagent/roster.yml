# smart-subagent 模型花名册 · 用户级（全局默认）  v2
# 作用：约束子任务能用哪些模型/agent；给模型起别名，派单/对话里用别名指代。
# 覆盖：项目根 .qoder/smart-subagent.roster.yml 存在时整体替换本文件。
# 详解：reference/model-routing.md（含命名规则、失效提醒协议、更新路径表）
version: 2
level: user

models:                                # 模型菜单：别名 → 实际模型（本机全量登记）
  # —— Qoder 系统自带：别名 = qoder-<名字> ——
  - alias: qoder-auto
    ref: Auto
    kind: system
  - alias: qoder-qwen3.8-max
    ref: Qwen3.8-Max
    kind: system
  - alias: qoder-qwen3.8-flash
    ref: Qwen3.8-Flash
    kind: system
  - alias: qoder-qwen3.7-max
    ref: Qwen3.7-Max
    kind: system
  - alias: qoder-qwen3.7-plus
    ref: Qwen3.7-Plus
    kind: system
  - alias: qoder-qwen3.7-flash
    ref: Qwen3.7-Flash
    kind: system
  - alias: qoder-deepseek-v4-pro
    ref: DeepSeek-V4-Pro
    kind: system
  - alias: qoder-deepseek-flash
    ref: DeepSeek-Flash
    kind: system
  - alias: qoder-glm-5.3
    ref: GLM-5.3
    kind: system
  - alias: qoder-glm-5.3-flash
    ref: GLM-5.3-Flash
    kind: system
  - alias: qoder-glm-5.2
    ref: GLM-5.2
    kind: system
  - alias: qoder-kimi-k3
    ref: Kimi-K3
    kind: system
  - alias: qoder-kimi-k2.8-preview
    ref: Kimi-K2.8-Preview
    kind: system
  - alias: qoder-minimax-m2.7
    ref: MiniMax-M2.7
    kind: system

  # —— BYOK（账号自带密钥，ref 写 UUID）：2026-09-23 账号侧 6 个 UUID 全部下架，条目已清空；续期后按 别名=<厂商>-<型号> 重新登记 ——

  # —— 通用接口（OpenAI 兼容自定义 provider）：别名自取；仅桌面端可用。
  #     ref 用全路径 qoder-custom-<provider-key>/<模型名>。2026-09-23 起钉新 key（21fa3498/a3ac5b3e），
  #     旧 key（ea168ca6/6faae4b7）待从 settings.json 删除。注意：钉桩解析失败会静默顶包会话模型，
  #     不报错——换桩后必须查 subagents transcript 里实际 "model" 字段实证。 ——
  - alias: mimo-v2.6-pro
    ref: qoder-custom-21fa3498-31a7-4c52-82a7-04c06fbaaee7/mimo-v2.6-pro
    kind: custom
    note: 自定义 provider；CLI 侧不可用（External Provider 门禁），仅桌面端
  - alias: mimo-v2.6-flash
    ref: qoder-custom-21fa3498-31a7-4c52-82a7-04c06fbaaee7/mimo-v2.6-flash
    kind: custom
    note: 同上（仅桌面端）
  - alias: mimo-v2.6-pro-ultraspeed
    ref: qoder-custom-a3ac5b3e-3f57-4065-a1df-0d5b041f9916/mimo-v2.6-pro-ultraspeed
    kind: custom
    note: 同上（仅桌面端）

  # —— 来源可辨的自定义 provider（2026-09-23 按 --menu 对账登记 5 个）——
  - alias: deepseek-flash
    ref: qoder-custom-0fc29a66-2db4-4994-b9e2-5551a6ef8a71/deepseek-flash
    kind: custom
    note: DeepSeek 官方（api.deepseek.com）；仅桌面端
  - alias: deepseek-v4.1-flash
    ref: qoder-custom-99a3cdde-036f-4fa8-a4c8-ed41e117b0bc/deepseek-v4.1-flash
    kind: custom
    note: 百炼 token-plan；仅桌面端
  - alias: glm-5.3
    ref: qoder-custom-99a3cdde-036f-4fa8-a4c8-ed41e117b0bc/glm-5.3
    kind: custom
    note: 百炼 token-plan；仅桌面端
  - alias: qwen3.8-flash
    ref: qoder-custom-99a3cdde-036f-4fa8-a4c8-ed41e117b0bc/qwen3.8-flash
    kind: custom
    note: 百炼 token-plan；仅桌面端
  - alias: qwen3.8-max
    ref: qoder-custom-99a3cdde-036f-4fa8-a4c8-ed41e117b0bc/qwen3.8-max
    kind: custom
    note: 百炼 token-plan；仅桌面端

agents:
  - name: mimo-worker
    uses: mimo-v2.6-flash             # 用户 2026-09-23 指定：子任务默认走 mimo-2.6-flash
    class: worker
    use_for: 通用执行（勘察+施工）：定位清点、追引用、改文件、写脚本跑通、修复并验证

routing:                               # 任务类别 → agent（类别在任务出现时判定，无需预知）
  # 2026-09-23 用户指定：子任务默认走 mimo-v2.6-flash；同日 glm-scout/ds-coder 退役（定义已删，仅留 mimo-worker 一员）。
  # 若 flash 通路被拦（如 CLI 侧 External Provider 门禁）→ 停下报告用户，无备员。
  scout: mimo-worker
  coder: mimo-worker
  worker: mimo-worker

on_out_of_roster: report               # 需要不在册的能力时：report=停下报告 / inline=主线自己干（绝不越册派）
