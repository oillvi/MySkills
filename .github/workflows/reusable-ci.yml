# 可复用 CI（reusable workflow）：放在中心仓库，其它项目一行调用，改一处全部生效。
# 放置位置：中心仓库（本机是 oillvi/MySkills）的 .github/workflows/reusable-ci.yml
# 设计取向：语言无关——把「装什么、查什么、测什么、构建什么」全部做成 input，
#           中心模板不硬编码任何项目专属命令。调用方示例见 caller-example.yml。
name: Reusable CI

# workflow_call 是可复用工作流的唯一入口：本文件因此不能独立触发，
# 只能被其它工作流用 uses: 调进来（同仓库调用写 ./.github/workflows/<文件名>）。
on:
  workflow_call:
    inputs:
      runs-on:
        description: 在哪种 runner 上跑（ubuntu-latest / windows-latest / self-hosted 等）
        type: string
        default: ubuntu-latest
      python-version:
        description: Python 版本；非 Python 项目也需要它，因为 setup-python 提供 pip 环境
        type: string
        default: '3.12'
      install-command:
        description: 装依赖与工具的完整命令。**每个 job 都会跑一遍**（job 之间不共享磁盘）。仓库没有依赖清单就把工具版本写死在这里
        type: string
        default: python -m pip install --upgrade pip
      lint-command:
        description: 静态检查命令。建议只拦致命错（如 ruff 的 E9,F63,F7,F82），风格问题另开一轮，否则 CI 第一天就长红
        type: string
        default: echo "no lint command configured"
      test-command:
        description: 测试命令。路径带空格的目录必须自己加引号
        type: string
        default: echo "no test command configured"
      build-command:
        description: 构建命令；留空则整个 build job 跳过
        type: string
        default: ''
      artifact-name:
        description: 上传产物的名字；留空则不上传。v4 起同一次 run 内 artifact 名字必须唯一
        type: string
        default: ''
      artifact-path:
        description: 要上传的产物路径
        type: string
        default: dist/
      run-lint:
        description: 是否执行 lint 阶段
        type: boolean
        default: true
      run-tests:
        description: 是否执行测试阶段
        type: boolean
        default: true
    outputs:
      artifact-id:
        description: 构建产物 artifact 的 id（build job 被跳过时为空）
        value: ${{ jobs.build.outputs.artifact-id }}

# 本模板不声明任何 secret，只消费调用方传进来的凭据，避免把真实密钥写进中心仓库。
# 确需按名传递时取消注释，并让调用方显式给值（比 secrets: inherit 安全）：
# secrets:
#   deploy-token:
#     required: false

# 最小权限：被调用工作流拿到的权限不会超过调用方 token 的权限，这里再收一层。
permissions:
  contents: read

# 有意不放 concurrency：官方 concurrency 文档（data/reusables/actions/jobs/section-using-concurrency.md）
# 只描述工作流级与 job 级用法，**没有**说明它在被调用工作流中的取消语义；
# 未验证的行为不写进中心模板。并发控制放在调用方，语义明确。

jobs:
  lint:
    if: ${{ inputs.run-lint }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      # 生产环境建议用 github/gh-actions-lock 把下面每个 action 钉到确切 commit sha
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      # 安全注意：inputs 会被插值进 shell。**绝不能**把不可信数据（如 github.event.issue.title、
      # PR 标题、分支名）当 input 传进来，否则等于把任意命令注入 runner（脚本注入攻击）。
      # 只传调用方仓库自己写死的命令字符串。
      - run: ${{ inputs.install-command }}
      - run: ${{ inputs.lint-command }}

  test:
    needs: lint
    # lint 被关掉时 needs 会连带跳过 test，用 !failure() && !cancelled() 兜住：
    # 「跳过」不阻塞下游，「真失败」仍然拦住。
    if: ${{ inputs.run-tests && !failure() && !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: ${{ inputs.install-command }}
      - run: ${{ inputs.test-command }}

  build:
    needs: [lint, test]
    if: ${{ inputs.build-command != '' && !failure() && !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: ${{ inputs.install-command }}
      - run: ${{ inputs.build-command }}
      # artifact-name 留空就跳过上传（steps.upload 不执行 → 输出为空）
      - id: upload
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 7
