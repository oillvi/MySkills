name: CI

# 本文件只做两件事：决定【何时跑】+ 把【跑什么】交给中心的可复用工作流。
# 换项目时只需改 with: 里的几条命令，流水线结构（lint→test→build）由中心统一维护。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md' # 纯文档改动不触发；本仓主体是技能文档，没必要每次烧 runner 分钟数
  pull_request:
    paths-ignore:
      - '**.md'

# 并发控制放在调用方（不是中心模板）：官方 concurrency 文档没有说明它在被调用工作流中的
# 取消语义，放这里语义明确——同一分支只保留最新一次运行，连续 push 自动取消旧的。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # 同仓库调用用相对路径 ./.github/workflows/<文件>；
    # 跨仓库调用写全路径 oillvi/MySkills/.github/workflows/reusable-ci.yml@main（见技能的 caller-example.yml）。
    uses: ./.github/workflows/reusable-ci.yml
    with:
      python-version: '3.12'
      # 仓库没有 requirements.txt / pyproject.toml，所以把工具版本写死在这里；
      # 也因此不开 setup-python 的 cache（官方要求能解析到依赖清单才能算 cache key）。
      install-command: pip install ruff==0.16.9 pytest==9.1.1
      # 只拦致命错（语法错误、未定义名字、无效比较）。ruff 默认全规则在本仓当前报 115 条，
      # 第一天全开会让 CI 长红、失去信号价值；规则集随代码质量逐步收紧。
      lint-command: ruff check --select E9,F63,F7,F82 .
      # 目录名 "token speed" 带空格，路径必须加引号（本机 94 passed 实测）。
      test-command: pytest -q "smart-subagent/tools/test_probe.py" "smart-subagent/tools/test_tasktime.py" "token speed/tests/test_tokspeed.py"
      # build-command / artifact-name 留空 → build job 整个跳过（本仓无构建产物）
      run-lint: true
      run-tests: true
